<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Dungeons · Бой</title><link rel="icon" href="./favicon.svg"></head><body class="battle-page">
<main class="battle-stage"><section class="battle-arena"><div id="board" class="board" role="group" aria-label="Боевая доска"></div><section id="result" class="battle-result" aria-live="polite" hidden><div class="result-card"><div class="chapter">БОЙ ЗАВЕРШЁН</div><h2 id="result-title"></h2><p id="result-detail"></p><p id="result-reward" class="result-reward"></p><p id="result-trophy" class="result-reward" hidden></p><button id="again" disabled class="primary-button">Выйти из боя</button></div></section></section></main>
<button id="debug-toggle" class="debug-toggle" aria-controls="debug-panel" aria-expanded="false">DEBUG · D</button>
<aside id="debug-panel" class="debug-panel" aria-label="Отладка боя" hidden><div class="debug-heading">DEBUG · БОЙ<button id="debug-close" aria-label="Закрыть дебаг-меню">×</button></div>
<div class="lab-board-label"><span id="turn" aria-live="polite">Загрузка боя…</span><button id="flip" disabled class="text-button">Перевернуть ↻</button></div>
<section class="game-panel"><label class="mode-label" for="battle-preset">Состав армий</label><select id="battle-preset" disabled></select><p id="description" class="lab-description"></p>
<label class="mode-label" for="depth">Противник · глубина поиска</label><select id="depth" disabled><option value="3">3 · Быстрый</option><option value="5" selected>5 · Обычный</option><option value="7">7 · Глубокий</option><option value="9">9 · Тщательный</option></select>
<label class="mode-label" for="ai-budget">Лимит расчёта хода</label><select id="ai-budget"><option value="0">Авто · по этажу</option><option value="50">50 мс</option><option value="150">150 мс</option><option value="400">400 мс</option><option value="1000">1 секунда</option><option value="3000">3 секунды</option></select>
<label class="toggle-row lab-toggle" for="sound"><span>Звук ходов</span><input id="sound" type="checkbox" role="switch" checked><span class="switch-track" aria-hidden="true"></span></label>
<div class="game-actions"><button id="undo" disabled class="secondary-button">↶ Отменить ход</button><button id="new" disabled class="primary-button">Новый бой</button></div><button id="redeploy" class="secondary-button">Повторная расстановка</button><button id="resign" disabled class="text-button lab-reset">Сдаться</button></section>
<p id="event" class="lab-event" aria-live="polite">Загрузка движка…</p><p id="search" class="lab-search"></p><div class="lab-legend"><span>② Камень · 2 HP</span><span>③ Алмаз · 3 HP</span><span>⚡ 2 урона</span><span>◇ Стекло</span></div>
<a href="./dungeon.html">Подземелье</a></aside>
<p id="battle-notice" class="battle-notice" role="status" hidden></p>
<dialog id="promotion" class="battle-promotion"><form method="dialog"><h2>Превращение пешки</h2><p>Выберите новую фигуру.</p><div id="promotion-options"></div><button value="cancel" class="text-button">Отмена</button></form></dialog><script type="module" src="/src/app/entry.js"></script></body></html>
